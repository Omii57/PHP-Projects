<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .contact-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 350px;
            text-align: center;
        }
        .contact-container h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .contact-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            font-size: 18px;
            color: #555;
        }
        .contact-item i {
            font-size: 24px;
            color: #007BFF;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="contact-container">
        <h2>Contact Us</h2>
        <div class="contact-item">
            <i class="fas fa-building"></i>
            <span>Vehicle Parking System</span>
        </div>
        <div class="contact-item">
            <i class="fas fa-phone"></i>
            <span>7219374045</span>
        </div>
        <div class="contact-item">
            <i class="fas fa-envelope"></i>
            <span>tejaskadam@gmail.com</span>
        </div>
        <div class="contact-item">
            <i class="fas fa-map-marker-alt"></i>
            <span>VP College Sangli</span>
        </div>
    </div>
</body>
</html>
